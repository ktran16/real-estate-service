name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies (dev group + dagster extra)
        run: uv sync --dev --extra dagster

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Run tests (pytest)
        run: uv run pytest -q

      - name: Validate Dagster definitions
        run: uv run dagster definitions validate -m danang_realestate.orchestration

      - name: dbt seed (load CI fixtures into the raw_* source tables)
        working-directory: dbt
        run: uv run dbt seed --target ci --profiles-dir .

      - name: dbt build (models + data tests on realistic seeded data)
        working-directory: dbt
        # Seeds already loaded above; exclude them so they aren't re-run.
        run: uv run dbt build --target ci --exclude resource_type:seed --profiles-dir .
