name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies (dev group + dagster extra)
        run: uv sync --dev --extra dagster

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Run tests (pytest)
        run: uv run pytest -q

      - name: Validate Dagster definitions
        run: uv run dagster definitions validate -m danang_realestate.orchestration

      - name: Initialize empty DuckDB schema
        run: uv run python -c "from danang_realestate.db import init_db; init_db()"

      - name: dbt build (run models + data tests on empty schema)
        working-directory: dbt
        run: uv run dbt build --profiles-dir .
