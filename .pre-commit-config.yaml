# Pre-commit hooks (mirror CI's static checks). Install once with:
#   uv run pre-commit install
# Run on demand with:
#   uv run pre-commit run --all-files
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        files: ^src/
        # mypy runs in an isolated env; ignore_missing_imports (pyproject) covers the rest.
        additional_dependencies: [pydantic>=2.0]
