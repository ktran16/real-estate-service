# Self-hosted Metabase for the Da Nang real estate marts.
#
# Reads the DuckDB file produced by the pipeline (read-only). See README.md for
# the important DuckDB file-locking note: DuckDB is single-writer, so the scrape
# pipeline cannot write data/danang.duckdb while this container holds it open.
# Workflow: stop Metabase -> run pipeline -> start Metabase (see README).
services:
  metabase:
    # Must be a Metabase 59.x image to match the duckdb driver release 1.5.3.0.
    image: metabase/metabase:v0.59.12
    container_name: danang-metabase
    ports:
      # Host 3001 -> container 3000 (host :3000 is used by another project).
      - "3001:3000"
    volumes:
      # DuckDB driver jar (run ./fetch-driver.sh first).
      - ./plugins:/plugins
      # The analytics database, mounted read-only.
      - ../data/danang.duckdb:/data/danang.duckdb:ro
      # Persist Metabase's own app state (questions, dashboards, users) across restarts.
      - ./metabase-data:/metabase-data
    environment:
      MB_PLUGINS_DIR: /plugins
      # Use an H2 app DB persisted on the mounted volume (fine for a single-user,
      # personal deployment). Switch to Postgres for a production/multi-user setup.
      MB_DB_TYPE: h2
      MB_DB_FILE: /metabase-data/metabase.db
    restart: unless-stopped
