# Self-hosted Metabase + its Postgres serving database for the Da Nang marts.
#
# Metabase reads the marts from Postgres (its built-in driver) — NOT from DuckDB.
# The Dagster pipeline publishes the marts into this Postgres after each run, so
# Metabase can stay up concurrently with pipeline writes (no single-writer dance).
#
# Run from this directory:
#   cp ../.env.example .env && edit .env   # set a strong POSTGRES_PASSWORD (once)
#   docker network create danang-net       # once (shared with the orchestration stack)
#   docker compose up -d
# Then in Metabase: Add database → PostgreSQL → host=postgres port=5432
#   db=danang user=danang password=<your POSTGRES_PASSWORD>.
# The password is read from the untracked .env in this dir — it is never committed.
services:
  postgres:
    image: postgres:16
    container_name: danang-postgres
    environment:
      POSTGRES_DB: ${PG_DB:-danang}
      POSTGRES_USER: ${PG_USER:-danang}
      # Required: no default, so the stack refuses to start without a real secret.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in metabase/.env}
    ports:
      # Bind to loopback only: host-based pipeline runs / psql reach 127.0.0.1:5433,
      # but the port is not exposed to other hosts on the network.
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U danang -d danang"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - danang-net
    restart: unless-stopped

  metabase:
    image: metabase/metabase:v0.59.12
    container_name: danang-metabase
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Host 3001 -> container 3000 (host :3000 is used by another project).
      - "3001:3000"
    volumes:
      # Persist Metabase's own app state (questions, dashboards, users) across restarts.
      - ./metabase-data:/metabase-data
    environment:
      # H2 app DB (Metabase's own metadata) — fine for a single-user deployment.
      MB_DB_TYPE: h2
      MB_DB_FILE: /metabase-data/metabase.db
    networks:
      - danang-net
    restart: unless-stopped

volumes:
  pgdata:

networks:
  danang-net:
    external: true
