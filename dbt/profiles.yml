danang_realestate:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: "../data/danang.duckdb"
      schema: main
    # CI target: a throwaway DuckDB file built from the seed fixtures (seeds are enabled
    # only when target.name == 'ci'). Keeps CI off the real dev/prod database.
    ci:
      type: duckdb
      path: "../data/ci.duckdb"
      schema: main
