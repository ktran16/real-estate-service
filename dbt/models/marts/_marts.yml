version: 2

models:
  - name: listings
    description: Analytics-ready listings, geocoded (cache coords backfilled).
    columns:
      - name: listing_id
        tests:
          - not_null
      - name: source
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["nhatot", "batdongsan", "mogi", "alonhadat"]
      - name: transaction_type
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["sale", "rent"]
      - name: property_type
        tests:
          - accepted_values:
              arguments:
                values: ["apartment", "house", "office", "land", "room", "other"]
      - name: is_broker
        tests:
          - not_null
      - name: is_active
        tests:
          - not_null

  - name: price_by_district
    description: Aggregated price stats per district / property type / transaction type.
    columns:
      - name: district
        tests:
          - not_null
      - name: listing_count
        tests:
          - not_null

  - name: price_changes
    description: Listings whose price moved by >= 5% between observations.
    columns:
      - name: listing_id
        tests:
          - not_null
      - name: price_change_pct
        tests:
          - not_null

  - name: price_trend
    description: Weekly median price trend per district / property / transaction type.
    columns:
      - name: week_start
        tests:
          - not_null

  - name: broker_listings
    description: Accounts with >= 5 active listings (likely brokers).
    columns:
      - name: account_id
        tests:
          - not_null
          - unique
      - name: active_listing_count
        tests:
          - not_null

  - name: price_per_sqm_by_ward
    description: Price-per-sqm percentiles (p25/median/p75/p90) per ward / transaction / property.
    columns:
      - name: ward
        tests:
          - not_null
      - name: listing_count
        tests:
          - not_null
      - name: median_price_per_sqm
        tests:
          - not_null

  - name: listing_days_on_market
    description: Per-listing days on market (posted_at → last seen) with a bucket label.
    columns:
      - name: listing_id
        tests:
          - not_null
      - name: days_on_market
        tests:
          - not_null
      - name: dom_bucket
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["0-7", "8-30", "31-90", "90+"]

  - name: listing_velocity
    description: Weekly new-vs-removed listing counts per district (supply pulse).
    columns:
      - name: week_start
        tests:
          - not_null
      - name: district
        tests:
          - not_null
      - name: new_listings
        tests:
          - not_null
      - name: removed_listings
        tests:
          - not_null

  - name: broker_concentration
    description: Broker share + top-account share of active listings per district.
    columns:
      - name: district
        tests:
          - not_null
          - unique
      - name: active_listings
        tests:
          - not_null
      - name: broker_share
        tests:
          - not_null

  - name: deals
    description: Active listings priced materially below the comparable district benchmark.
    columns:
      - name: listing_id
        tests:
          - not_null
      - name: discount_pct
        tests:
          - not_null
      - name: benchmark_price_per_sqm
        tests:
          - not_null
      - name: comparable_count
        tests:
          - not_null
